# See https://prek.j178.dev/builtin/ for more information

repos:
  # --- Basic hooks for all subdirectories here ---
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: '\.min\.js$'
      - id: end-of-file-fixer
        exclude: '\.min\.js$'
      - id: check-yaml
      - id: check-toml
      - id: check-symlinks
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.min\.js$'

  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14  # frozen: v1.48.0
    hooks:
      - id: typos
        exclude: ".+[.]min[.]js$"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 321478e58f4938179c6b86e4ddfa923d1547a49b  # frozen: v0.16.6
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
