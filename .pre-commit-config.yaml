# See https://prek.j178.dev/builtin/ for more information

repos:
  # --- Basic hooks for all subdirectories here ---
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: '\.min\.js$'
      - id: end-of-file-fixer
        exclude: '\.min\.js$'
      - id: check-yaml
      - id: check-toml
      - id: check-symlinks
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.min\.js$'

  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14  # frozen: v1.48.0
    hooks:
      - id: typos
        exclude: ".+[.]min[.]js$"

  # ruff comes from uv.lock (dependency group "lint")
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group lint ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
