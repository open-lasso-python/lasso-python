name: Python Linting, Test and Upload

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # JOB
  # This job runs the prek hooks (formatting, linting, typos, zizmor, ...)
  prek:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  # JOB
  # This job runs unit tests, linting and format checks
  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    strategy:
      # Stop the remaining matrix jobs if one fails.
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d

      # Cache dependencies from uv to speed things up
      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}

      - name: Install and upgrade pip and uv
        run: python -m pip install --upgrade pip uv

      - name: Install Dependencies
        run: ./bin/task setup

      - name: Lint code
        run: ./bin/task lint

      - name: Test code
        run: ./bin/task test

  # JOB
  # This job builds the package and optionally publishes it to Test PyPI.
  test-publish:
    permissions:
      contents: read
    needs: [prek, tests]

    if: >
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    env:
      HAS_TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN != '' }}
    # Required for installation of the test package in the
    # next job.
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      published: ${{ steps.publish.outcome == 'success' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # setuptools-scm needs the tags to compute the version
        with:
          fetch-depth: 0
          persist-credentials: false

      # For publishing any version will do
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip uv
          ./bin/task setup

      - name: Build packages for release
        run: uv build

      - name: Remember version
        id: extract_version
        run: |
          VERSION=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).name.split("-")[1])')
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Save test packages as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-dist
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Publish distribution to Test PyPI
        id: publish
        if: env.HAS_TEST_PYPI_API_TOKEN == 'true'
        env:
          UV_PUBLISH_URL: https://test.pypi.org/legacy/
          UV_PUBLISH_CHECK_URL: https://test.pypi.org/simple/
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: uv publish --verbose # zizmor: ignore[use-trusted-publishing] TODO: migrate Test PyPI to trusted publishing.

  # JOB
  # Test installation from Test PyPI or the built wheel.
  test-install:
    needs: [test-publish]
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.ref, 'refs/heads/release/')

    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.test-publish.outputs.version }}
      PUBLISHED: ${{ needs.test-publish.outputs.published }}

    steps:
      # Install python (be aware NO checkout action)
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package from Test PyPI
        if: env.PUBLISHED == 'true'
        run: |
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple \
            lasso-python=="${VERSION}"

      - name: Download test packages
        if: env.PUBLISHED != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-dist
          path: dist

      - name: Install package from artifact
        if: env.PUBLISHED != 'true'
        run: python -m pip install dist/*.whl

      # We run the D3plot import here as it is the most delicate piece of the
      # package for importing C-libraries.
      - name: Test if the installed package works
        run: python -c 'from lasso.dyna import D3plot'

  # JOB
  # Finally publish the code to pypi
  publish:
    permissions:
      contents: write
    needs: [test-install]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      HAS_PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # We need the entire git history for building the docs
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip uv
          ./bin/task setup

      - name: Build packages for release
        run: uv build

      # Not required but this saves the distribution files
      # with the package upload for debugging purposes.
      - name: Save packages as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - name: Publish distribution to PyPI
        if: env.HAS_PYPI_API_TOKEN == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --verbose # zizmor: ignore[use-trusted-publishing] TODO: migrate PyPI to trusted publishing.

      - name: Upload new docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Pass credentials to Git subprocesses without storing them in the checkout.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH_HEADER"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"
          ./bin/task docs:deploy
