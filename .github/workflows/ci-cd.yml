name: Python Linting, Test and Upload

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # JOB
  # This job runs the prek hooks (formatting, linting, typos, zizmor, ...)
  prek:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ruff hooks run through uv, from the version in uv.lock
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  # JOB
  # This job runs the unit tests on the oldest supported Python with the lowest
  # dependency versions allowed by pyproject.toml, and on the newest Python with
  # the locked dependencies.
  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: ${{ matrix.resolution }}

    strategy:
      # Stop the remaining matrix jobs if one fails.
      fail-fast: true
      matrix:
        include:
          - python-version: "3.11"
            resolution: lowest-direct
          - python-version: "3.14"
            resolution: highest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.resolution }}

      - name: Install Dependencies
        run: uv run task setup

      - name: Test code
        run: uv run task test

  # JOB
  # This job builds the distributions once, they are then published as-is.
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # setuptools-scm needs the tags to compute the version
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build packages
        run: uv build --no-sources

      - name: Remember version
        id: extract_version
        run: |
          VERSION=$(basename dist/*.whl | cut -d- -f2)
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Save packages as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # JOB
  # This job publishes the built packages to Test PyPI.
  test-publish:
    needs: [prek, tests, build]
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Publish distribution to Test PyPI
        env:
          UV_PUBLISH_URL: https://test.pypi.org/legacy/
          UV_PUBLISH_CHECK_URL: https://test.pypi.org/simple/
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: uv publish --verbose # zizmor: ignore[use-trusted-publishing] TODO: migrate Test PyPI to trusted publishing.

  # JOB
  # Test installation from Test PyPI.
  test-install:
    needs: [build, test-publish]
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      # Install python (be aware NO checkout action)
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package from Test PyPI
        run: |
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple \
            lasso-python=="${VERSION}"

      # We run the D3plot import here as it is the most delicate piece of the
      # package for importing C-libraries.
      - name: Test if the installed package works
        run: python -c 'from lasso.dyna import D3plot'

  # JOB
  # Publish the packages that were tested on Test PyPI to PyPI.
  publish:
    needs: [test-install]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Publish distribution to PyPI
        env:
          UV_PUBLISH_CHECK_URL: https://pypi.org/simple/
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --verbose # zizmor: ignore[use-trusted-publishing] TODO: migrate PyPI to trusted publishing.

  # JOB
  # Build and push the documentation to the gh-pages branch.
  docs:
    permissions:
      contents: write
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # We need the entire git history for building the docs
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Install Dependencies
        run: uv run task setup

      - name: Upload new docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Pass credentials to Git subprocesses without storing them in the checkout.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH_HEADER"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"
          uv run task docs:deploy
